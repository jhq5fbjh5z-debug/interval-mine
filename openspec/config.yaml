# openspec/config.yaml
schema: spec-driven
artifact_store: hybrid

context: |
  Tech stack: React 18 + Vite 6 + TypeScript 5
  Architecture: Opera extension (Chromium MV3) via @crxjs/vite-plugin
  Testing: Vitest 3 (unit tests)
  Style: No ESLint/Prettier configured; strict TS

strict_tdd: true

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
    tdd: true
    test_command: "vitest run"
  verify:
    test_command: "vitest run"
    build_command: "tsc --noEmit"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas (large removals)

testing:
  strict_tdd: true
  detected: "2026-05-04"
  runner:
    command: "vitest run"
    framework: vitest
  layers:
    unit:
      available: true
      tool: vitest
    integration:
      available: false
      tool: null
    e2e:
      available: false
      tool: null
  coverage:
    available: true
    command: "vitest --coverage"
  quality:
    linter:
      available: false
      command: null
    type_checker:
      available: true
      command: "tsc --noEmit"
    formatter:
      available: false
      command: null
